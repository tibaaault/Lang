name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  # Permet aussi de relancer un déploiement à la main depuis l'onglet Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les poussées rapprochées ne se marchent pas
# dessus, la dernière gagne.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Déterminer le chemin du site
        id: base
        run: |
          # Un dépôt nommé <compte>.github.io est servi à la racine du domaine ;
          # tous les autres le sont sous /<nom-du-depot>/.
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" == *.github.io ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$repo/" >> "$GITHUB_OUTPUT"
          fi

      - name: Construire
        # Les identifiants Supabase viennent de .env.production, versionné :
        # la clé publishable est publique par conception. Les passer par des
        # secrets d'Actions les écraserait par du vide s'ils manquaient.
        env:
          VITE_BASE: ${{ steps.base.outputs.path }}
        run: npm run build

      - name: Servir index.html sur les chemins inconnus
        # GitHub Pages renvoie 404.html pour toute URL non trouvée ; en y
        # mettant la page principale, un lien profond ouvre l'application.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
